name: Build & Release (Android + iOS + Windows)

# Budowanie i wydanie wyłącznie po wypchnięciu tagu wersji (np. v1.2.3).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.ver.outputs.base }}
      name: ${{ steps.ver.outputs.name }}
      code: ${{ steps.ver.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wersja
        id: ver
        run: |
          BASE="${GITHUB_REF_NAME#v}"
          NAME="$BASE"
          CODE=$(( ${{ github.run_number }} + 100 ))
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Klucz podpisu
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Testy jednostkowe
        run: gradle testDebugUnitTest --stacktrace

      - name: Budowanie APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: gradle :app:assembleRelease -PversionCode=${{ needs.version.outputs.code }} -PversionName=${{ needs.version.outputs.name }} --stacktrace

      - name: Przygotowanie pliku
        run: cp app/build/outputs/apk/release/app-release.apk "OpenDocument-${{ needs.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: OpenDocument-${{ needs.version.outputs.name }}-android
          path: OpenDocument-${{ needs.version.outputs.name }}.apk

  # Aplikacja iOS: framework z Kotlina (Compose Multiplatform) i powłoka Xcode generowana przez
  # XcodeGen. Plik .ipa nie jest podpisany – instaluje się go przez AltStore lub Sideloadly.
  ios:
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts') }}

      - name: Framework Kotlin
        run: gradle :shared:linkReleaseFrameworkIosArm64 --stacktrace

      - name: Projekt Xcode
        working-directory: iosApp
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Budowanie aplikacji
        working-directory: iosApp
        run: |
          xcodebuild -project OpenPDF.xcodeproj -scheme OpenPDF -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/derived \
            MARKETING_VERSION=${{ needs.version.outputs.base }} \
            CURRENT_PROJECT_VERSION=${{ needs.version.outputs.code }} \
            OPENPDF_VERSION=${{ needs.version.outputs.name }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Pakowanie IPA
        working-directory: iosApp
        run: |
          APP=$(find build/derived/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "../OpenDocument-${{ needs.version.outputs.name }}.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: OpenDocument-${{ needs.version.outputs.name }}-ios
          path: OpenDocument-${{ needs.version.outputs.name }}.ipa

  # Windows: przeglądarka Compose Desktop; jedynym plikiem wydania jest instalator Inno Setup.
  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Obraz aplikacji
        # Cudzysłów: PowerShell rozbija niecytowane „-Px=1.9.0” na kropkach.
        run: gradle :desktopApp:createDistributable "-PversionName=${{ needs.version.outputs.name }}" --stacktrace

      - name: Instalator
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ needs.version.outputs.name }}" "/DSourceDir=$PWD\desktopApp\build\compose\binaries\main\app\OpenDocument" desktopApp\installer\OpenDocument.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "desktopApp\installer\output\OpenDocument-${{ needs.version.outputs.name }}-setup-x64.exe" .

      - uses: actions/upload-artifact@v4
        with:
          name: OpenDocument-${{ needs.version.outputs.name }}-windows
          path: OpenDocument-${{ needs.version.outputs.name }}-setup-x64.exe

  release:
    needs: [version, android, ios, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publikacja wydania
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.version.outputs.name }}
          BASE: ${{ needs.version.outputs.base }}
        run: |
          TAG="v$NAME"
          NOTES=$(awk -v version="$BASE" '$0 == "## " version { found=1; next } found && /^## / { exit } found { print }' CHANGELOG.md)
          if [ "$NAME" != "$BASE" ]; then
            LOG=$(git log -5 --pretty='- %s' "$GITHUB_SHA")
            NOTES=$(printf 'Poprawki i ulepszenia:\n\n%s' "$LOG")
          fi
          FOOTER=$(printf -- '---\n**Android:** pobierz **OpenDocument-%s.apk** i zainstaluj go na telefonie (Android 10+).\n\n**iPhone / iPad:** pobierz **OpenDocument-%s.ipa** i zainstaluj przez AltStore lub Sideloadly (iOS 16.4+).\n\n**Windows:** pobierz **OpenDocument-%s-setup-x64.exe** i uruchom instalator (Windows 10/11, 64-bit).' "$NAME" "$NAME" "$NAME")
          gh release create "$TAG" "dist/OpenDocument-$NAME.apk" "dist/OpenDocument-$NAME.ipa" "dist/OpenDocument-$NAME-setup-x64.exe" \
            --target "$GITHUB_SHA" \
            --title "OpenDocument $NAME" \
            --notes "$(printf '%s\n\n%s' "$NOTES" "$FOOTER")" \
            --latest
