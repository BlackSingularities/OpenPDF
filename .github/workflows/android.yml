name: Build & Release APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # Wersja z pliku VERSION. Gdy wydanie o tym numerze już istnieje (kolejny merge bez
      # podbicia wersji), dostaje przyrostek z numerem budowania – każdy merge to nowe wydanie.
      - name: Wersja
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE=$(tr -d '[:space:]' < VERSION)
          NAME="$BASE"
          if git rev-parse -q --verify "refs/tags/v$BASE" >/dev/null; then
            NAME="$BASE.${{ github.run_number }}"
          fi
          CODE=$(( ${{ github.run_number }} + 100 ))
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Klucz podpisu
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Testy jednostkowe
        run: gradle testDebugUnitTest --stacktrace

      - name: Budowanie APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: gradle assembleRelease -PversionCode=${{ steps.ver.outputs.code }} -PversionName=${{ steps.ver.outputs.name }} --stacktrace

      - name: Przygotowanie pliku
        run: cp app/build/outputs/apk/release/app-release.apk "OpenPDF-${{ steps.ver.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: OpenPDF-${{ steps.ver.outputs.name }}
          path: OpenPDF-${{ steps.ver.outputs.name }}.apk

      - name: Publikacja wydania
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.name }}"
          NOTES=$(awk -v version="${{ steps.ver.outputs.base }}" '$0 == "## " version { found=1; next } found && /^## / { exit } found { print }' CHANGELOG.md)
          if [ "${{ steps.ver.outputs.name }}" != "${{ steps.ver.outputs.base }}" ]; then
            LOG=$(git log -5 --pretty='- %s' "$GITHUB_SHA")
            NOTES=$(printf 'Poprawki i ulepszenia:\n\n%s' "$LOG")
          fi
          gh release create "$TAG" "OpenPDF-${{ steps.ver.outputs.name }}.apk" \
            --target "$GITHUB_SHA" \
            --title "OpenPDF ${{ steps.ver.outputs.name }}" \
            --notes "$(printf '%s\n\n---\nPobierz plik **OpenPDF-%s.apk** poniżej i zainstaluj go na telefonie (Android 10+).' "$NOTES" "${{ steps.ver.outputs.name }}")" \
            --latest
